<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pharmaceutical Order Fulfillment</title>

    <!-- Load CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💊 Pharmaceutical Order Fulfillment Platform</h1>

        <!-- CREATE ORDER -->
        <div class="card">

            <h2>Create Order</h2>

            <label for="customerId">Customer ID</label>
            <input
                type="text"
                id="customerId"
                placeholder="Customer ID, for example HOSP100"
            >

            <label for="customerType">Customer Type</label>
            <select id="customerType">
                <option value="Hospital">Hospital</option>
                <option value="Pharmacy">Pharmacy</option>
            </select>

            <label for="medicineCode">Medicine Code</label>
            <input
                type="text"
                id="medicineCode"
                placeholder="Medicine Code, for example MED001"
            >

            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                min="1"
                placeholder="Quantity"
            >

            <button type="button" onclick="createOrder()">
                Place Order
            </button>

            <div id="createResult"></div>

        </div>

        <!-- TRACK ORDER -->
        <div class="card">

            <h2>Track Order</h2>

            <label for="orderId">Order ID</label>
            <input
                type="text"
                id="orderId"
                placeholder="Enter Order ID"
            >

            <button type="button" onclick="trackOrder()">
                Track Order
            </button>

            <div id="trackResult"></div>

        </div>

        <!-- MEDICINES -->
        <div class="card">

            <h2>Medicines List</h2>

            <button type="button" onclick="getMedicines()">
                View Medicines
            </button>

            <div id="medicineList"></div>

        </div>

    </div>

    <!-- Load JavaScript -->
    <script src="script.js"></script>

</body>

</html>
