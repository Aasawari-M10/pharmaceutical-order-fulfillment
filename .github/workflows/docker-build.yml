name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build-order-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Order API
        run: |
          docker build -t ghcr.io/sakitdhar/order-api:latest ./order-api

      - name: Push Order API
        run: |
          docker push ghcr.io/sakitdhar/order-api:latest

  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Worker
        run: |
          docker build -t ghcr.io/sakitdhar/fulfillment-worker:latest ./fulfillment_worker

      - name: Push Worker
        run: |
          docker push ghcr.io/sakitdhar/fulfillment-worker:latest
