<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Signing in...</title>

<style>

    body {

        margin: 0;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        font-family:
            Arial,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eff6ff,
                #f5f3ff
            );

        color: #172033;

    }

    .loader {

        text-align: center;

    }

    .spinner {

        width: 42px;

        height: 42px;

        margin: 0 auto 18px;

        border: 4px solid #dbeafe;

        border-top-color: #2563eb;

        border-radius: 50%;

        animation:
            spin 0.8s linear infinite;

    }

    @keyframes spin {

        to {

            transform:
                rotate(360deg);

        }

    }

    h2 {

        margin: 0;

        font-size: 20px;

    }

    p {

        color: #64748b;

        font-size: 13px;

    }

</style>
```

</head>

<body>

```
<div class="loader">

    <div class="spinner"></div>

    <h2>
        Signing you in...
    </h2>

    <p>
        Please wait while we securely
        authenticate your account.
    </p>

</div>
```

</body>

</html>
